<style>
  :root{ --ink:#0E1216; --card:#161C22; --line:#232B33; --cream:#F7F3EC; --accent:#E0964A; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:40px 24px 80px; background:var(--ink); color:var(--cream);

  h1{ font-size:30px; margin:0 0 6px; }
  p.lead{ color:rgba(247,243,236,.6); margin:0 0 36px; }
  .grid{ display:grid; gap:22px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  figure{ margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  img{ width:100%; height:230px; object-fit:cover; display:block; background:#0a0d10; }
  figcaption{ padding:14px 16px 16px; }
  .name{ font-family:ui-monospace, Consolas, monospace; font-size:13px; color:var(--accent); word-break:break-all; }
  .desc{ font-size:14.5px; color:rgba(247,243,236,.72); margin-top:6px; }
  .tag{ display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
        color:rgba(247,243,236,.55); border:1px solid var(--line); border-radius:99px; padding:3px 10px; margin-bottom:8px; }
</style>
</head>
